name: Gildie
version: '1.3'
main: pl.gildie.GildiePlugin
api-version: '1.20'
author: Gildie
description: Gildie z terenem, ochrona, regeneracja TNT, wojny, jajo, sztandar
softdepend: [ReiMinimap]
commands:
  g:
    description: Komendy gildii
    usage: /g <zaloz|zapros|dom|ubw|bw|...>
    aliases: [gildia, guild]
  wojna:
    description: System wojen gildii – GUI, wyzwanie, statystyki, historia
    usage: /wojna [wyzwij <tag> [1-3]|stats <tag>|historia]
    aliases: [wojny, war]
permissions:
  gildie.admin:
    description: Admin wojna/tnt
    default: op
